# 农场管家系统 - Docker Compose 配置
# 使用方法:
# 1. 安装 Docker Desktop: https://www.docker.com/products/docker-desktop/
# 2. 在项目根目录运行: docker-compose up -d
# 3. 访问 http://localhost:5173 查看前端
# 4. 访问 http://localhost:3000 查看后端 API

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: farm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: farm_management
    ports:
      - "5432:5432"
      mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - farm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB 时序数据库
  influxdb:
    image: influxdb:2.7-alpine
    container_name: farm-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: farm-org
      DOCKER_INFLUXDB_INIT_BUCKET: farm_management
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: farm-management-token-2024
    ports:
      - "8086:8086"
      mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - farm-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: farm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
      mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
      - redis_data:/data
    networks:
      - farm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MQTT Broker (Eclipse Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: farm-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
      mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    networks:
      - farm-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/farm_management
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: farm_management
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: farm-management-token-2024
      INFLUX_ORG: farm-org
      INFLUX_BUCKET: farm_management
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_USERNAME: guest
      MQTT_PASSWORD: guest
      JWT_SECRET: farm-management-super-secret-jwt-key-production
      JWT_ACCESS_TOKEN_EXPIRY: 2h
      REFRESH_TOKEN_SECRET: farm-management-super-secret-refresh-key-production
      REFRESH_TOKEN_EXPIRY: 7d
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farm-network
      mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
      - ./backend/logs:/app/logs

  # 前端服务 (开发模式)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farm-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_APP_TITLE: 农场管家系统
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - farm-network
      mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
      - ./frontend:/app
      - /app/node_modules

  # 数据库管理工具 (可选)
  adminer:
    image: adminer:latest
    container_name: farm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - farm-network

  mysql:
    image: mysql:8.0
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: farm_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
  mysql_data:
      - mysql_data:/var/lib/mysql
      - ./scripts/setup-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network

volumes:
  mysql_data:
  postgres_data:
  influxdb_data:
  redis_data:
  mqtt_data:
  mqtt_logs:

networks:
  farm-network:
    driver: bridge
